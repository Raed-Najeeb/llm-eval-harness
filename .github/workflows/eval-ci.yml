name: Eval Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Run regression gate on committed baseline
        run: python src/eval_harness/regression_gate.py

      - name: Upload scored results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scored-outputs
          path: data/results/scored_outputs.jsonl